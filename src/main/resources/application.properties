########################################################################
# Nexpose Security Console (POC) - application configuration
#
# NOTE: three planted CONFIGURATION defects live in this file:
#   NEX-3108  nexpose.ldap.url / nexpose.ldap.base-dn point at a directory
#             that does not exist -> directory logins fail.
#   NEX-3109  spring.sql.init.mode=never -> schema.sql never runs, so the
#             report_history table is never created.
#   NEX-3110  nexpose.scan.async.max-pool-size=0 -> the background scan
#             executor cannot be initialised.
# The "fix" for each is noted inline.
########################################################################

spring.application.name=nexpose-console
server.port=8090

# ---- JSP view resolver -------------------------------------------------
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# ---- H2 (embedded, in-memory) -----------------------------------------
spring.datasource.url=jdbc:h2:mem:nexpose;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate: entity tables (scan/asset/vulnerability/user) are created
# by ddl-auto and work fine.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---- SQL init (schema.sql) --------------------------------------------
# DEFECT NEX-3109: 'never' means schema.sql is skipped and report_history is
# never created. FIX: change to 'always'.
spring.sql.init.mode=never

# ---- Scan engine pool --------------------------------------------------
nexpose.scan.pool-size=3
nexpose.scan.acquire-timeout-seconds=5

# ---- Background scan executor -----------------------------------------
nexpose.scan.async.core-pool-size=1
# DEFECT NEX-3110: max pool size of 0 is invalid for a ThreadPoolExecutor.
# FIX: set to 4.
nexpose.scan.async.max-pool-size=0
nexpose.scan.async.queue-capacity=25

# ---- LDAP / directory authentication ----------------------------------
nexpose.ldap.enabled=true
# DEFECT NEX-3108: this host does not exist in the lab.
# FIX: ldap://ldap.lab.rapid7.com:389
nexpose.ldap.url=ldap://ldap.internal.rapid7.local:389
# DEFECT NEX-3108: wrong base DN (should be dc=rapid7,dc=com).
nexpose.ldap.base-dn=dc=rapid7,dc=local
nexpose.ldap.user-dn-pattern=uid={0},ou=people
nexpose.ldap.connect-timeout-ms=5000

# ---- Logging -----------------------------------------------------------
logging.level.root=INFO
logging.level.com.rapid7.nexpose=DEBUG
